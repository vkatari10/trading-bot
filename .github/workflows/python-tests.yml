name: Python Tests

on: [push, pull_request]

jobs:
  test-python:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set Up Python
        uses: actions/setup-python@v4
        with: 
          python-version: '3.11'
       
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Python Tests
        run: PYTHONPATH=. pytest