name: Go Tests

on: [push, pull_request]

jobs:
  test-go:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set Up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      
      - name: Run Go Tests
        run: |
          cd src/runtime/go-src/tests
          go mod tidy
          go test